plugins {
    id "com.android.application"
}

android {
    namespace "it.evocore.sample"
    compileSdk 35

    defaultConfig {
        applicationId "it.evocore.sample"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation project(":evocore-contract")
    implementation "androidx.activity:activity:1.10.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    def javacName = System.getProperty("os.name").toLowerCase().contains("win") ? "javac.exe" : "javac"
    options.forkOptions.executable = new File(System.getProperty("java.home"), "bin/${javacName}").absolutePath
}
