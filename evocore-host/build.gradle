plugins {
    id "com.android.application"
}

android {
    namespace "it.evocore.host"
    compileSdk 35

    defaultConfig {
        applicationId "it.evocore.host"
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "0.3.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk false
        }
    }
}

dependencies {
    implementation project(":evocore-contract")
    implementation project(":evocore-telemetry")
    implementation project(":llamaLib")
    implementation "androidx.activity:activity:1.10.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:core:1.7.0"
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    def javacName = System.getProperty("os.name").toLowerCase().contains("win") ? "javac.exe" : "javac"
    options.forkOptions.executable = new File(System.getProperty("java.home"), "bin/${javacName}").absolutePath
}
